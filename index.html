<!DOCTYPE html>

<head>

<title>Leads Maceió — Prospecção</title>
<style>
:root{--bg:#0c1118;--card:#151c26;--card2:#1b2433;--txt:#e8edf4;--mut:#8b98ab;--bd:#26334a;
--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;--wa:#25d366}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:60px}
header{padding:20px 16px 12px;max-width:1200px;margin:0 auto}
h1{font-size:22px;font-weight:800}
h1 span{color:var(--green)}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:1200px;margin:12px auto 0;padding:0 16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi small{color:var(--mut);font-size:11px}
.bar{max-width:1200px;margin:14px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px}
input[type=search],select{background:var(--card);border:1px solid var(--bd);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:14px;outline:none}
input[type=search]{flex:1;min-width:180px}
input[type=search]:focus,select:focus{border-color:var(--green)}
.tpl{max-width:1200px;margin:10px auto 0;padding:0 16px}
.tpl details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
.tpl summary{cursor:pointer;font-size:13px;color:var(--mut);user-select:none}
.tpl textarea{width:100%;margin-top:8px;background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:10px;font-size:13px;min-height:70px;font-family:inherit}
.grid{max-width:1200px;margin:14px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#3a4d6e;transform:translateY(-1px)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nome{font-weight:700;font-size:15px}
.tier{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;flex-shrink:0}
.tA{background:#0d2b1c;color:var(--green)}.tB{background:#2b210d;color:var(--amber)}.tC{background:#2b0f0d;color:#f87171}
.meta{color:var(--mut);font-size:12.5px;margin-top:3px}
.stars{color:var(--amber);font-size:12.5px;margin-top:2px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1;min-width:86px;text-align:center;padding:8px 6px;border-radius:9px;font-size:12.5px;font-weight:700;text-decoration:none;color:#fff;border:none;cursor:pointer}
.bwa{background:var(--wa);color:#06250f}
.big{background:linear-gradient(135deg,#e1306c,#f77737)}
.bgg{background:var(--card2);color:var(--txt);border:1px solid var(--bd)}
.btn:active{transform:scale(.97)}
.status{margin-top:8px;width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:12.5px}
.s-Contatado{border-color:var(--blue)!important}.s-Respondeu{border-color:var(--amber)!important}
.s-Reunião{border-color:#a855f7!important}.s-Fechou{border-color:var(--green)!important}.s-Perdeu{border-color:var(--red)!important}
.vazio{text-align:center;color:var(--mut);padding:40px 16px;grid-column:1/-1}
.count{max-width:1200px;margin:4px auto 0;padding:0 16px;color:var(--mut);font-size:12.5px}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

    d.innerHTML = `
      <div class="top"><div class="nome">${esc(l.e)}</div><span class="tier t${l.t}">${l.t}</span></div>
      <div class="meta">${esc(l.n)} · ${l.b ? esc(l.b)+" · " : ""}${esc(l.c)}</div>
      <div class="stars">★ ${l.nt} <span style="color:var(--mut)">(${l.av} avaliações)</span>
        ${l.f ? ' · <span style="color:var(--mut)">'+esc(l.f)+(l.tp==="Fixo"?" 🏢":"")+'</span>':""}</div>
      <div class="acts">
        ${l.w ? `<a class="btn bwa" target="_blank" rel="noopener" href="${esc(waLink(l))}">WhatsApp</a>`:""}
        <a class="btn big" target="_blank" rel="noopener" href="${esc(igUrl)}">${esc(igTxt)}</a>
        <a class="btn bgg" target="_blank" rel="noopener" href="${esc(ggLink(l))}">📍 Google</a>
      </div>
      <select class="status s-${st}" data-k="${esc(key(l))}">
        ${["Novo","Contatado","Respondeu","Reunião","Fechou","Perdeu"].map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}
      </select>`;
    d.querySelector(".status").addEventListener("change", ev => {
      status[ev.target.dataset.k] = ev.target.value;
      localStorage.setItem(ST_KEY, JSON.stringify(status));
      ev.target.className = "status s-" + ev.target.value;
      if($("fs").value) render();
    });
    frag.appendChild(d);
  });
  g.appendChild(frag);
}
["q","fp","fc","ft","fn","fs","fi"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
